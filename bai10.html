<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10 - Trang liên hệ</title>
    <link rel="stylesheet" href="style10.css">
</head>
<body>
    <div class="khung-form">
        <div class="tieu-de-form">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ</p>
        </div>
        <form class="than-form">
            <div class="luoi-hai-cot">
                <div class="o-nhap">
                    <label>Họ và tên</label>
                    <input type="text" value="Nguyễn Văn An">
                </div>
                <div class="o-nhap">
                    <label>Email</label>
                    <input type="email" value="an.nv@tlu.edu.vn">
                </div>
                <div class="o-nhap">
                    <label>Số điện thoại</label>
                    <input type="text" value="0987 654 321">
                </div>
                <div class="o-nhap">
                    <label>Chủ đề</label>
                    <select>
                        <option>Hỏi về khóa học</option>
                    </select>
                </div>
            </div>
            <div class="o-nhap">
                <label>Nội dung</label>
                <textarea rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
            </div>
            <div class="vung-checkbox">
                <input type="checkbox" id="dong-y" checked>
                <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
            </div>
            <div class="vung-nut-bam">
                <button type="button" class="nut-gui">Gửi liên hệ</button>
                <button type="button" class="nut-nhap-lai">Nhập lại</button>
            </div>
        </form>
    </div>
</body>
</html>
