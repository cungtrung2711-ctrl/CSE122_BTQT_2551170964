<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6 - Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>
    <div class="khung-bai">
        <div class="cot-trai">
            <img src="Bat.gif" alt="Minh họa món ăn">
        </div>
        <div class="cot-phai">
            <h2 class="tieu-de">Các món ngon Hà Nội</h2>
            <table class="bang-mon-an">
                <thead>
                    <tr>
                        <th class="cot-stt">STT</th>
                        <th>Tên món ăn</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="cot-stt">1</td>
                        <td>Bánh cuốn Thanh Trì</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">2</td>
                        <td>Xôi Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">3</td>
                        <td>Chả cá Lã Vọng</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">4</td>
                        <td>Cháo Cóc</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">5</td>
                        <td>Bánh Gai Ninh Giang</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">6</td>
                        <td>Bún Thang Hà Nội</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">7</td>
                        <td>Canh Lằng</td>
                    </tr>
                    <tr>
                        <td class="cot-stt">8</td>
                        <td>Vịt Quay Lạng Sơn</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
