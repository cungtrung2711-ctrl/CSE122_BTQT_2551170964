<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11 - Thư viện ảnh </title>
    <link rel="stylesheet" href="style11.css">
</head>
<body>
    <div class="khung-trang">
        <h2 class="tieu-de">Thư viện ảnh Việt Nam</h2>
        <p class="mo-ta">Bộ sưu tập 6 danh thắng tiêu biểu - minh họa thẻ figure/figcaption</p>
        <div class="luoi-anh">
            <figure class="the-anh">
                <img src="1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <figcaption>Hình 1.Vịnh Hạ Long</figcaption>
            </figure>
            <figure class="the-anh">
                <img src="2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
            </figure>
            <figure class="the-anh">
                <img src="3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <figcaption>Hình 3. Thác Bản Giốc</figcaption>
            </figure>
            <figure class="the-anh">
                <img src="4-fansipan.jpg" alt="Fansipan">
                <figcaption>Hình 4. Fansipan</figcaption>
            </figure>
            <figure class="the-anh">
                <img src="5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <figcaption>Hình 5.Đồng bằng sông Cửu Long</figcaption>
            </figure>
            <figure class="the-anh">
                <img src="6-phong-nha.jpg" alt="Động Phong Nha">
                <figcaption>Hình 6.Động Phong Nha</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
